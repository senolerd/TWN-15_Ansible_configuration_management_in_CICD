- name: Bootstraping Jenkins
  hosts: tag_AnsibleGroup_jenkins_controller
  remote_user: ubuntu
  gather_facts: false
  vars:
    jenkins_war_path: "/home/ubuntu/jenkins.war"

  tasks:
  - name: Wait for Jenkins SSH available
    ansible.builtin.wait_for_connection:
      delay: 5
      timeout: 300
      
  - name: Manually gather facts
    ansible.builtin.setup:  

  - name: Update apt repo cache
    become: yes
    ansible.builtin.apt:
      update_cache: yes
      cache_valid_time: 3600

  - name: Install APT Packages 
    become: yes
    apt:
      name: "{{item}}"
      state: latest
    loop: "{{ lookup('pipe', 'terraform -chdir=../ output -json jenkins_apt_pkcs') | from_json}}"

  - name: Download latest jenkins war file
    ansible.builtin.get_url:
      url: https://get.jenkins.io/war-stable/latest/jenkins.war
      dest: ~/jenkins.war
      mode: '0700'

  - name: Create systemd directory for user
    ansible.builtin.file:
      path: ~/.config/systemd/user/
      state: directory
      mode: '0755'

  - name: Lingering enable for ubuntu user
    command: loginctl enable-linger ubuntu
  
  - name: Deploy Jenkins systemd unit file from template
    ansible.builtin.template:
      src: jenkins_svc_unit.j2
      dest: ~/.config/systemd/user/jenkins.service 
      mode: '0644'

  - name: Ensure Jenkins service is started and enabled
    ansible.builtin.systemd_service:
      name: jenkins
      state: started
      daemon_reload: true
      enabled: true
      scope: user
    environment:
      XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.user_uid }}"      

  - name: Try to read initial admin password file
    block:
      - name: Waiting for initial password file
        command: stat ~/.jenkins/secrets/initialAdminPassword
        register: initial_pass_looking_result
        until: initial_pass_looking_result.rc == 0
        retries: 8
        delay: 5

      - name: Getting initial password
        command: cat "~/.jenkins/secrets/initialAdminPassword"
        when: initial_pass_looking_result.rc == 0
        register: temp_adm_pass

      - name: Writing initial password to local file
        ansible.builtin.copy:
          content: "{{temp_adm_pass.stdout| trim}}"
          dest: ../../JENKINS_INITIAL_ADMIN_KEY_DELETE_ME_LATER.txt
          mode: '0644'
        when: initial_pass_looking_result.rc == 0
        delegate_to: localhost
      - debug: msg="Initial Admin Password is {{temp_adm_pass.stdout | trim}}"
        when: initial_pass_looking_result.rc == 0

  - name: Install Jenkins plugins
    get_url:
      url: https://updates.jenkins.io/latest/{{item}}.hpi
      dest: ~/.jenkins/plugins/
    loop: "{{ lookup('pipe', 'terraform -chdir=../ output -json jenkins_plugins') | from_json}}"

  - name: Ensure Jenkins service is restarted after plugin installs
    ansible.builtin.systemd_service:
      name: jenkins
      state: restarted
      scope: user
    environment:
      XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.user_uid }}"

  - name: Waiting for Jenkins port is open
    ansible.builtin.wait_for:
      port: 8080

