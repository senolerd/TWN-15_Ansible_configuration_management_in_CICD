- name: Ansible Controller Bootstrap
  hosts: tag_AnsibleGroup_workstation
  gather_facts: false
  remote_user: ubuntu
  become: yes
  tasks:
  - name: Waiting for SSH available
    ansible.builtin.wait_for_connection:
      delay: 5
      timeout: 300

  - name: Updating apt repo cache
    become: yes
    ansible.builtin.apt:
      update_cache: yes
      cache_valid_time: 3600

  - name: Installing APT Packages for workstations
    become: yes
    apt:
      name: "{{item}}"
      state: latest
    loop: "{{ lookup('pipe', 'terraform -chdir=../ output -json workstation_apt_pkcs') | from_json}}"