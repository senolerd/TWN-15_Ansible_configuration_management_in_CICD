- name: Workstation Works
  hosts: AnsibleGroup_workstation
  remote_user: ubuntu
  gather_facts: false
  tasks:
    - name: Wait for SSH available
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 300

    - name: Manually gather facts
      ansible.builtin.setup:

    - name: Install Podman
      become: yes
      apt:
        name: podman
        state: latest

    - name: Lingering enable for ubuntu user
      command: loginctl enable-linger ubuntu