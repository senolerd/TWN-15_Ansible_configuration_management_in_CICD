- name: Bootstraping Jenkins
  hosts: tag_AnsibleGroup_jenkins_controller
  remote_user: ubuntu
  gather_facts: false
  tasks:

  - name: Wait for Jenkins SSH available
    ansible.builtin.wait_for_connection:
      delay: 5
      timeout: 300

  - name: Update apt repo cache
    become: yes
    ansible.builtin.apt:
      update_cache: yes
      cache_valid_time: 3600

  - name: Install APT Packages
    become: yes
    apt:
      name: "{{item}}"
      state: latest
    loop: "{{ lookup('pipe', 'terraform -chdir=../ output -json jenkins_apt_pkcs') | from_json}}"

  - name: Lingering enable for ubuntu user
    command: loginctl enable-linger ubuntu
  
  - name: Lingering confirm
    command: loginctl show-user ubuntu --property=Linger
    register: lingering_confirmation_ret
  - debug: msg={{lingering_confirmation_ret.stdout}}

  - name: Create Jenkins home volume
    containers.podman.podman_volume:
      state: present
      name: jenkins_home

  - name: Create pod for Jenkins
    containers.podman.podman_pod:
      name: jenkins-pod
      state: started
      ports:
        - "8080:8080"  

  - name: Create containers attached to the pod
    containers.podman.podman_container:
      name: "jenkins-container"
      state: started
      pod: jenkins-pod
      image: docker.io/jenkins/jenkins:2.568.3-lts
      volume:
      - jenkins_home:/var/jenkins_home
  
  - name: Try to read initial admin password file
    block:
      - name: Waiting for initial password file
        command: podman exec jenkins-container stat /var/jenkins_home/secrets/initialAdminPassword
        register: initial_pass_looking_result
        until: initial_pass_looking_result.rc == 0
        retries: 8
        delay: 5

      - name: Getting initial password
        containers.podman.podman_container_exec:
          name: jenkins-container
          argv: 
          - cat 
          - "/var/jenkins_home/secrets/initialAdminPassword"
        when: initial_pass_looking_result.rc == 0
        register: temp_adm_pass

      - name: Writing initial password to local file
        ansible.builtin.copy:
          content: "{{temp_adm_pass.stdout| trim}}"
          dest: ../../JENKINS_INITIAL_ADMIN_KEY_DELETE_ME_LATER.txt
          mode: '0644'
        when: initial_pass_looking_result.rc == 0
        delegate_to: localhost
      - debug: msg="Initial Admin Password is {{temp_adm_pass.stdout | trim}}"
        when: initial_pass_looking_result.rc == 0

    rescue:
      - debug: msg="File not read, seems it is not first run of the Jenkins"

  - name: Install Jenkins plugins
    containers.podman.podman_container_exec:
      name: jenkins-container
      command: "jenkins-plugin-cli --plugins {{item}}"
    loop: "{{ lookup('pipe', 'terraform -chdir=../ output -json jenkins_plugins') | from_json}}"

  - name: Restart a Podman container for loading new plugins
    containers.podman.podman_container:
      name: jenkins-container
      state: started
      force_restart: true

